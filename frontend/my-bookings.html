<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Οι Κρατήσεις μου</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏨 Hotel Booking</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Αρχική</a>
            <a class="nav-link" href="login.html" id="nav-login">Σύνδεση</a>
            <a class="nav-link active" href="my-bookings.html" id="nav-bookings">Οι Κρατήσεις μου</a>
            <a class="nav-link" href="#" id="nav-logout" style="display:none;" onclick="logout()">Αποσύνδεση (<span id="user-name"></span>)</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Οι Κρατήσεις μου</h1>
    <div id="bookingsList"></div>
</div>

<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">Αξιολόγηση Δωματίου <span id="reviewRoomNumber"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="reviewBookingId">
                
                <div class="mb-3">
                    <label for="reviewRating" class="form-label fw-bold">Βαθμολογία (1-5)</label>
                    <select class="form-select" id="reviewRating">
                        <option value="5">⭐⭐⭐⭐⭐ (5/5) - Εξαιρετικό</option>
                        <option value="4">⭐⭐⭐⭐ (4/5) - Πολύ Καλό</option>
                        <option value="3">⭐⭐⭐ (3/5) - Καλό</option>
                        <option value="2">⭐⭐ (2/5) - Μέτριο</option>
                        <option value="1">⭐ (1/5) - Κακό</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="reviewComment" class="form-label fw-bold">Σχόλιο (Προαιρετικό)</label>
                    <textarea class="form-control" id="reviewComment" rows="3" placeholder="Πείτε μας για την εμπειρία σας..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Ακύρωση</button>
                <button type="button" class="btn btn-primary" onclick="submitReview()">Υποβολή</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
